name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - name: Install NDK required by the stockfish plugin
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: opening-master-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opening-master-apk
          path: apk
      - name: Create or update release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 apk/app-release.apk \
            --title "Opening Master v1.0.0" \
            --notes "Install: download app-release.apk and sideload it on your Android device." \
            --clobber || gh release upload v1.0.0 apk/app-release.apk --clobber
